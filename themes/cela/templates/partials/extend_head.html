{% if config.extra.enable_mathjax %}
  {% if page.extra.mathjax %}
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        ignoreHtmlClass: "no-mathjax",
        processHtmlClass: "mathjax"
      }
    };
  </script>
  {% endif %}
{% endif %}

<style>
    /* 导航栏整体设置 */
    .header {
        position: relative !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        z-index: 1;
    }

    .header .nav {
        justify-content: flex-end !important;
        padding-top: 0px; /* 调整这个值可以改变右侧菜单的高度 */
        padding-bottom: 20px;
    }

    /* 修复左侧悬浮 Logo 的对齐和位置 */
    .logo {
        position: fixed !important;
        /* 【关键：垂直对齐】 */
        /* 如果觉得 NutD'Blog 还是偏低，把 top 从 20px 改成 18px 或 16px */
        top: 15px; 
        
        /* 【关键：水平位置】往左挪，减小 500px 后面的负偏移量即可 */
        /* 比如原来是 -40px，现在改成 -80px 会更靠左 */
        left: max(10px, calc(50% - 500px - 60px)); 

        display: flex !important;
        align-items: center !important; /* 强制内部元素垂直居中对齐 */
        gap: 4px; /* Logo文字和月亮之间的间距 */
        
        z-index: 1001;
        background: var(--theme); /* 确保背景遮挡滚动文字（跟随明暗主题切换） */
        padding: 4px 12px;
        border-radius: 4px;
    }

    /* 确保右侧菜单也垂直居中 */
    #menu {
        display: flex;
        align-items: center;
        margin-left: auto !important;
    }

    #menu li {
        display: flex;
        align-items: center;
    }

    /* 响应式：窗口太小时隐藏左侧悬浮 */
    @media screen and (max-width: 1150px) {
        .logo {
            display: none !important;
        }
    }
</style>

<style>
/* 全局通用隐藏类（搜索框、Notes 页等都在用） */
.hidden { display: none !important; }
</style>
